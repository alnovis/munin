[package]
name = "munin-mcp"
version = "0.2.5"
edition = "2024"
authors = ["Alexander Novikov <dev@alnovis.io>"]
description = "Local memory for AI coding agents: an MCP server and a CLI over one SQLite file"
license = "MIT"
repository = "https://github.com/alnovis/munin"
keywords = ["mcp", "memory", "agents", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "munin"
path = "src/lib.rs"

[[bin]]
name = "munin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
regex = "1.13.2"
rmcp = { version = "3.12.0", default-features = false, features = ["base64", "macros", "server", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"
